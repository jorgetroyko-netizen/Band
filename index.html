<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Repertório da Banda</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: one phone-width column. Sticky header, fixed bottom tabs, song cards instead of table columns, bottom sheets for editing. */
:root{
  --bg:#ECEFF2; --surface:#FFFFFF; --ink:#141922; --muted:#5A6473; --line:#D2D8E0; --chip:#E3E8EE;
  --accent:#C81E66; --on-accent:#FFFFFF; --star:#D99100; --danger:#B3261E; --scrim:rgba(20,25,34,.55);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10141A; --surface:#1A2029; --ink:#EEF1F5; --muted:#9BA5B3; --line:#2C3440; --chip:#262E3A;
    --accent:#FF5C9D; --on-accent:#1C0410; --star:#FFC53D; --danger:#FF8A80; --scrim:rgba(0,0,0,.65);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10141A; --surface:#1A2029; --ink:#EEF1F5; --muted:#9BA5B3; --line:#2C3440; --chip:#262E3A;
  --accent:#FF5C9D; --on-accent:#1C0410; --star:#FFC53D; --danger:#FF8A80; --scrim:rgba(0,0,0,.65);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.35;-webkit-text-size-adjust:100%}
html.locked,html.locked body{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit;-webkit-tap-highlight-color:transparent}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p,ol{margin:0;padding:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.wrap{max-width:640px;margin-inline:auto;padding-inline:16px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px}
.brand{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.04em;text-transform:uppercase}
.whobtn{display:flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-weight:600;font-size:14px}
.whobtn small{color:var(--muted);font-weight:500}

#banner{background:var(--chip);border-bottom:1px solid var(--line);font-size:14px}
#banner .wrap{padding-block:10px}

main{padding-block:14px 96px}
.tools{display:flex;gap:8px;align-items:stretch}
.search{flex:1;min-width:0}
.search input,.field input{width:100%;height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.on{border-color:var(--accent);color:var(--accent)}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn.block{width:100%}
.btn.icon{width:44px;padding:0;font-size:24px;line-height:1}
.field textarea{width:100%;min-height:130px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font:inherit;color:inherit;resize:vertical}
.pv{display:flex;flex-direction:column;gap:6px;font-size:14px}
.pv small{color:var(--muted)}
.pv .dup{color:var(--muted);text-decoration:line-through}
.btn[disabled]{opacity:.5}
.link{color:var(--accent);font-weight:600;padding:8px 0}

#filters{margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.fgroup{display:flex;flex-direction:column;gap:6px}
.flabel{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:36px;padding:0 12px;border-radius:999px;background:var(--chip);font-size:14px;font-weight:500;display:inline-flex;align-items:center}
.chip.on{background:var(--accent);color:var(--on-accent)}

.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-block:12px 8px;font-size:14px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{min-height:36px;padding:0 12px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--ink);color:var(--bg)}
.seg.wide{display:flex}
.seg.wide button{flex:1;min-height:44px;text-align:center}

.list{display:flex;flex-direction:column;gap:8px}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;display:flex;flex-direction:column;gap:10px;align-items:center}

/* song card */
.card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 8px 10px 12px}
.card-main{display:flex;flex-direction:column;gap:2px;min-width:0;padding-block:2px}
.s-title{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.s-artist{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:4px;grid-column:1/-1;cursor:pointer}
.tag{display:inline-flex;align-items:center;min-height:22px;padding:0 7px;border-radius:6px;background:var(--chip);font-size:12px;font-weight:500;white-space:nowrap}
.tag.key{font-family:var(--f-mono);font-weight:600;background:transparent;border:1.5px solid var(--ink)}
.tag.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tag.empty{background:transparent;border:1px dashed var(--line);color:var(--muted);font-family:var(--f-body);font-weight:400}

.stars{display:flex;align-items:center}
.stars button{width:32px;height:40px;display:grid;place-items:center;color:var(--muted)}
.stars svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}
.stars .star.on{color:var(--star)}
.stars .star.on svg{fill:currentColor}
.stars .zero span{width:24px;height:24px;border-radius:50%;border:1.6px solid currentColor;display:grid;place-items:center;font-size:12px;font-weight:600;font-family:var(--f-mono)}
.stars .zero.on{color:var(--ink)}
.stars .zero.on span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stars.big button{width:44px;height:44px}
.stars.big svg{width:30px;height:30px}
.stars.big .zero span{width:30px;height:30px;font-size:14px}
.ministars{display:inline-flex;gap:1px;color:var(--star)}
.ministars svg{width:16px;height:16px;fill:currentColor}
.ministars svg.off{fill:none;stroke:var(--muted);stroke-width:1.6}

/* ranking */
.progress{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;font-size:14px}
.ini{width:24px;height:24px;border-radius:50%;background:var(--chip);display:inline-grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:600}
.pname{display:flex;align-items:center;gap:8px;font-weight:500}
.bar{height:6px;border-radius:3px;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.pnum{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.rrow{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.pos{font-family:var(--f-display);font-weight:700;font-size:22px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.rmain{display:flex;flex-direction:column;gap:2px;min-width:0}
.mvs{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.mv{display:inline-flex;align-items:center;gap:4px;min-height:22px;padding:0 7px;border-radius:6px;background:var(--chip);font-family:var(--f-mono);font-size:12px;font-weight:600}
.mv.none{background:transparent;border:1px dashed var(--line);color:var(--muted);font-weight:500}
.rtotal{display:flex;align-items:center;gap:3px;font-family:var(--f-display);font-weight:700;font-size:28px;font-variant-numeric:tabular-nums}
.rtotal svg{width:18px;height:18px;fill:var(--star)}
.note{font-size:14px;color:var(--muted);text-align:center;padding:10px 0}

/* setlists */
.form{display:flex;flex-direction:column;gap:10px;margin-top:10px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field span{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.row{display:flex;gap:8px}
.row>*{flex:1}
.ghead{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-block:16px 6px}
.setcard{display:flex;flex-direction:column;gap:2px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.setcard b{font-family:var(--f-display);font-size:24px;font-weight:700;letter-spacing:.01em;line-height:1.1;overflow-wrap:anywhere}
.setcard span{font-size:14px;color:var(--muted)}
.back{color:var(--accent);font-weight:600;min-height:44px;display:inline-flex;align-items:center}
.set-head{display:flex;flex-direction:column;gap:2px;margin-bottom:10px}
.set-head h2{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1.05;text-wrap:balance;overflow-wrap:anywhere}
.set-head p{color:var(--muted);font-size:14px}
.setlist{list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.setlist li{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px;align-items:center;padding:10px 10px 10px 8px}
.setlist li+li{border-top:1px solid var(--line)}
.setlist .n{font-family:var(--f-display);font-weight:700;font-size:22px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.sl-main{display:flex;flex-direction:column;min-width:0;gap:1px}
.sl-main .tags{margin-top:5px}
.sl-main b{font-weight:600;overflow-wrap:anywhere}
.sl-main .sub{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.sl-info{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.sl-ctl{display:flex}
.sl-ctl button{width:38px;height:40px;display:grid;place-items:center;font-size:18px;color:var(--muted)}
.sl-ctl button[disabled]{opacity:.3}
.sl-ctl .rm{color:var(--danger)}
.stack{display:flex;flex-direction:column;gap:8px;margin-top:12px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:flex;padding-inline:8px}
.tab{flex:1;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent)}

/* sheet */
#sheet{position:fixed;inset:0;z-index:10;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim)}
.panel{width:100%;max-width:640px;max-height:90%;overflow-y:auto;background:var(--bg);border-radius:18px 18px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.panel.tall{height:90%}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet-head h2{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.05;overflow-wrap:anywhere}
.sheet-head p{color:var(--muted);font-size:15px;margin-top:2px}
.x{width:44px;height:44px;flex:none;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:18px}
.sec{display:flex;flex-direction:column;gap:8px}
.sec h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;align-items:center}
.sec h3 b{font-family:var(--f-mono);font-size:16px;color:var(--ink);letter-spacing:0;text-transform:none}
.vrow{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:36px}
.vrow .dim{color:var(--muted);font-size:14px}
.notes{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.pick{min-height:46px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-family:var(--f-mono);font-weight:600;font-size:16px;text-align:center}
.pick.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pick.txt{font-family:var(--f-body)}
.pick[disabled]{opacity:.4}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.stepper{display:grid;grid-template-columns:repeat(2,minmax(0,1fr)) minmax(0,1.4fr) repeat(2,minmax(0,1fr));gap:6px;align-items:stretch}
.stepper input,.stepper output{min-height:46px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-family:var(--f-mono);font-weight:600;font-size:18px;text-align:center;width:100%;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.stepper input{display:block;padding:0}
.stepper.three{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) minmax(0,1fr)}
.plist{display:flex;flex-direction:column;gap:6px;flex:1;min-height:0;overflow-y:auto;margin-inline:-4px;padding-inline:4px}
.prow{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;padding:8px 10px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.prow .ck{width:24px;height:24px;border-radius:6px;border:1.6px solid var(--muted);display:grid;place-items:center;font-size:15px;font-weight:700;color:transparent}
.prow.in{border-color:var(--accent)}
.prow.in .ck{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.ptot{display:flex;align-items:center;gap:2px;font-family:var(--f-mono);font-size:13px;font-weight:600;color:var(--muted)}
.ptot svg{width:13px;height:13px;fill:var(--star)}

/* login */
#login{min-height:80vh;display:grid;place-items:center;padding:24px 16px}
.login-box{width:100%;max-width:360px;display:flex;flex-direction:column;gap:16px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.login-box h1{font-family:var(--f-display);font-weight:700;font-size:44px;line-height:1;text-transform:uppercase;letter-spacing:.01em}
.who-grid{display:flex;flex-direction:column;gap:8px}
.who{min-height:60px;padding:0 18px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-family:var(--f-display);font-weight:600;font-size:26px;letter-spacing:.02em;display:flex;justify-content:space-between;align-items:center}
.who i{font-style:normal;color:var(--accent)}
.hint{font-size:14px;color:var(--muted)}

#toast{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:20;margin-inline:auto;max-width:420px;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:10px;font-size:14px;text-align:center}
@media (prefers-reduced-motion:no-preference){.panel{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>
<body>

<div id="login" hidden></div>

<div id="app" hidden>
  <header class="top"><div class="wrap">
    <span class="brand">Repertório</span>
    <button class="whobtn" data-act="switch-user" aria-label="Trocar de pessoa"><span id="who"></span><small>trocar</small></button>
  </div></header>
  <div id="banner" hidden><div class="wrap" id="banner-text"></div></div>
  <main class="wrap" id="view"></main>
  <nav class="tabs" aria-label="Seções"><div class="wrap">
    <button class="tab" data-act="tab" data-tab="biblioteca"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>Biblioteca</button>
    <button class="tab" data-act="tab" data-tab="ranking"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.3 1.1 6.1L12 16.9 6.6 19.8l1.1-6.1L3.2 9.4l6.1-.8z"/></svg>Ranking</button>
    <button class="tab" data-act="tab" data-tab="repertorios"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12"/><path d="M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>Repertórios</button>
  </div></nav>
</div>

<div id="sheet" hidden></div>
<div id="toast" role="status" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

function setSongs(set){return (Array.isArray(set.songs)?set.songs:[]).filter(function(id){return S.songs[id]&&!S.songs[id].removed})}
function setSummary(set){
  var ids=setSongs(set),dur=0,known=0;
  ids.forEach(function(id){var d=+S.songs[id].dur||0;if(d>0){dur+=d;known++}});
  var t=ids.length+(ids.length===1?' música':' músicas');
  if(known>0){
    t+=' · ≈ '+fmtTotal(dur);

function libIds(){
  var q=norm(S.q),f=S.f;
  var ids=songIds().filter(function(id){

    if(f.origin&&s.origin!==f.origin)return false;
    if(f.voice&&s.voice!==f.voice)return false;
    if(f.genre&&s.genre!==f.genre)return false;
    if(f.nokey&&s.key)return false;
    if(f.novote&&getVote(S.me,id)!=null&&!S.stick[id])return false;
    return true;

  var k=S.sort==='artist'?'artist':'title';

    x=sortKey(S.songs[a].title);y=sortKey(S.songs[b].title);

        '<div class="plist" id="plist"></div></div>';
      el.hidden=false;S.sheet.built=true;
    }
    var inSet={};setSongs(set).forEach(function(id){inSet[id]=true});
    var q=norm(S.sheet.q||'');
    var rows=songIds().filter(function(id){var s=S.songs[id];return !q||norm(s.title+' '+s.artist).indexOf(q)>=0})
      .map(function(id){return {id:id,total:stats(id).total}});
    rows.sort(function(a,b){
      if(b.total!==a.total)return b.total-a.total;
      var x=sortKey(S.songs[a.id].title),y=sortKey(S.songs[b.id].title);return x<y?-1:x>y?1:0;
    });
    $('#pcount').textContent=(set.name||'Sem nome')+' · '+Object.keys(inSet).length+' no repertório';
    $('#plist').innerHTML=rows.length?rows.map(function(r){
      var s=S.songs[r.id],on=!!inSet[r.id];

        '<span class="ptot">'+r.total+STAR+'</span></button>';
    }).join(''):'<div class="empty">Nenhuma música com essa busca.</div>';
  }
}
function parseLines(text){
  var out=[];
  String(text||'').split(/\n+/).forEach(function(l){
    l=l.trim().replace(/^[-•*]\s+/,'').replace(/^\d+[.)]\s+/,'');
    if(!l)return;
    var o={title:'',artist:'',key:'',origin:'',genre:''};
    if(l.indexOf('|')>=0){
      var p=l.split('|').map(function(x){return x.trim()});
      o.title=p[0]||'';o.artist=p[1]||'';
      p.slice(2).forEach(function(x){
        if(/^nac/i.test(x))o.origin='Nac';
        else if(/^int/i.test(x))o.origin='Int';
        else if(/^[A-G][#b]?m?$/.test(x))o.key=x;
        else GENRES.forEach(function(g){if(norm(g)===norm(x))o.genre=g});
      });
    }else{
      var m=/\(([A-G][#b]?m?)\)\s*$/.exec(l);
      if(m){o.key=m[1];l=l.slice(0,m.index).trim()}
      var i=l.search(/\s[-–—]\s/);
      if(i>=0){o.title=l.slice(0,i).trim();o.artist=l.slice(i).replace(/^\s[-–—]\s/,'').trim()}else o.title=l;
    }
    if(o.title)out.push(o);
  });
  return out;
}
function addItems(){
  var seen={},t=$('#add-text');
  songIds().forEach(function(id){var s=S.songs[id];seen[norm(s.title)+'|'+norm(s.artist)]=true});
  return parseLines(t?t.value:'').map(function(o){
    var k=norm(o.title)+'|'+norm(o.artist);o.dup=!!seen[k];seen[k]=true;return o;
  });
}
function renderAdd(){
  var sh=S.sheet,box=$('#add-opts'),pv=$('#add-preview');
  if(!sh||sh.type!=='add'||!box||!pv)return;
  box.innerHTML='<h3>Origem e gênero desta lista</h3><div class="grid2">'+
    pickBtn('add-origin','Nac','Nacional',sh.origin==='Nac',' txt')+pickBtn('add-origin','Int','Internacional',sh.origin==='Int',' txt')+'</div>'+
    '<div class="chips">'+GENRES.map(function(g){
      return '<button class="chip'+(sh.genre===g?' on':'')+'" data-act="add-genre" data-v="'+esc(g)+'" aria-pressed="'+(sh.genre===g)+'">'+esc(g)+'</button>';
    }).join('')+'</div>';
  var items=addItems(),ok=items.filter(function(o){return !o.dup}),h='';
  if(items.length){
    h+='<h3>Conferência</h3><div class="pv">'+items.map(function(o){
      return '<div'+(o.dup?' class="dup"':'')+'><b>'+esc(o.title)+'</b>'+(o.artist?' · '+esc(o.artist):' <small>(sem artista)</small>')+
        (o.key?' · '+esc(o.key):'')+(o.dup?' <small>já está na biblioteca</small>':'')+'</div>';
    }).join('')+'</div>';
  }
  h+='<button class="btn primary block" data-act="add-save"'+(ok.length?'':' disabled')+'>'+
    (ok.length?'Adicionar '+ok.length+(ok.length===1?' música':' músicas'):'Adicionar')+'</button>';
  pv.innerHTML=h;
}
function pickBtn(act,v,label,on,extra){
  return '<button class="pick'+(on?' on':'')+(extra||'')+'" data-act="'+act+'" data-v="'+esc(v)+'" aria-pressed="'+!!on+'">'+esc(label)+'</button>';
}
function songSheetHTML(id){
  var s=S.songs[id],k=parseKey(s.key),ro=S.readOnly?' disabled':'';
  var h='<div class="panel" role="dialog" aria-modal="true" aria-label="'+esc(s.title)+'"><div class="sheet-head"><div><h2>'+esc(s.title)+'</h2><p>'+esc(s.artist)+(memberName(s.by)?' · adicionada por '+esc(memberName(s.by)):'')+'</p></div>'+
    '<button class="x" data-act="close-sheet" aria-label="Fechar">✕</button></div>';
  h+='<section class="sec"><h3>Votos</h3>';
  MEMBERS.forEach(function(m){
    var v=getVote(m.id,id);
    if(m.id===S.me)h+='<div class="vrow"><b>'+esc(m.name)+' (você)</b>'+starsHTML(id,v,true)+'</div>';
    else h+='<div class="vrow"><span>'+esc(m.name)+'</span>'+(v==null?'<span class="dim">ainda não votou</span>':(v===0?'<span class="dim">0 estrelas</span>':miniStars(v)))+'</div>';
  });
  h+='</section>';
  h+='<section class="sec"><h3>Tom da banda <b>'+(s.key?esc(s.key):'–')+'</b></h3><div class="notes">'+
    ['C','D','E','F','G','A','B'].map(function(n){return pickBtn('key-note',n,n,k.note===n)}).join('')+'</div>'+
    '<div class="grid2">'+pickBtn('key-acc','#','♯ sustenido',k.acc==='#',' txt')+pickBtn('key-acc','b','♭ bemol',k.acc==='b',' txt')+'</div>'+
    '<div class="grid2">'+pickBtn('key-mode','M','Maior',!!k.note&&k.mode==='',' txt')+pickBtn('key-mode','m','Menor',k.mode==='m',' txt')+'</div>'+
    (s.key?'<button class="link" data-act="key-clear">Tirar o tom</button>':'')+'</section>';
  h+='<section class="sec"><h3>BPM</h3><div class="stepper">'+
    '<button class="pick" data-act="bpm-step" data-d="-5">−5</button><button class="pick" data-act="bpm-step" data-d="-1">−1</button>'+
    '<input id="bpm-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" aria-label="BPM" placeholder="–" value="'+((+s.bpm>0)?+s.bpm:'')+'"'+ro+'>'+
    '<button class="pick" data-act="bpm-step" data-d="1">+1</button><button class="pick" data-act="bpm-step" data-d="5">+5</button></div></section>';
  h+='<section class="sec"><h3>Voz</h3><div class="grid3">'+pickBtn('set-voice','H','H',s.voice==='H')+pickBtn('set-voice','M','M',s.voice==='M')+pickBtn('set-voice','HM','H+M',s.voice==='HM')+'</div></section>';
  h+='<section class="sec"><h3>Origem</h3><div class="grid2">'+pickBtn('set-origin','Nac','Nacional',s.origin==='Nac',' txt')+pickBtn('set-origin','Int','Internacional',s.origin==='Int',' txt')+'</div></section>';
  h+='<section class="sec"><h3>Gênero</h3><div class="chips">'+GENRES.map(function(g){
    return '<button class="chip'+(s.genre===g?' on':'')+'" data-act="set-genre" data-v="'+esc(g)+'" aria-pressed="'+(s.genre===g)+'">'+esc(g)+'</button>';
  }).join('')+'</div></section>';
  h+='<section class="sec"><h3>Duração</h3><div class="stepper three"><button class="pick" data-act="dur-step" data-d="-15">−15 s</button>'+
    '<output>'+((+s.dur>0)?fmtDur(+s.dur):'–')+'</output><button class="pick" data-act="dur-step" data-d="15">+15 s</button></div>'+
    ((+s.dur>0)?'<button class="link" data-act="dur-clear">Tirar a duração</button>':'')+'</section>';
  if(S.me==='jorge'){
    h+=S.sheet.confirmRm?
      '<div class="form"><b>Tirar esta música da biblioteca?</b><span>Ela sai também dos repertórios e do ranking.</span><div class="row">'+
      '<button class="btn" data-act="rm-song-cancel">Cancelar</button><button class="btn danger" data-act="rm-song">Tirar</button></div></div>':
      '<button class="btn block danger" data-act="rm-song-ask">Tirar da biblioteca</button>';
  }
  return h+'</div>';
}

/* ---------- top-level render ---------- */
function renderBanner(){
  var b=$('#banner');
  if(S.readOnly){b.hidden=false;$('#banner-text').textContent='O banco de dados recusou a gravação. Avise o Jorge.'}
  else b.hidden=true;
}
function mount(force){
  if(mounted===S.tab&&!force)return;
  mounted=S.tab;
  if(S.tab==='biblioteca')mountLib();else if(S.tab==='ranking')mountRank();else $('#view').innerHTML='';
}
function refresh(){
  var gate=!S.word,login=!gate&&!S.me;
  $('#login').hidden=!(gate||login);$('#app').hidden=gate||login;
  if(gate){if(mounted!=='gate'){mounted='gate';renderGate()}return}
  if(login){mounted=null;renderLogin();return}
  $('#who').textContent=memberName(S.me);
  document.querySelectorAll('.tab').forEach(function(b){b.setAttribute('aria-current',b.dataset.tab===S.tab?'page':'false')});
  renderBanner();mount(false);
  if(S.tab==='biblioteca')refreshLib();else if(S.tab==='ranking')refreshRank();else refreshSets(false);
  refreshSheet(false);
}

/* ---------- actions ---------- */
function patchSong(id,fields,delay){patchDoc('lib/songs',{songs:(function(){var o={};o[id]=fields;return o})()},delay)}
function guard(){if(S.readOnly){toast('Você está só com leitura.');return false}if(!S.db){toast('Os dados ainda não abriram.');return false}return true}
function clamp(n,a,b){return Math.max(a,Math.min(b,n))}

var ACT={
  'enter-word':function(){
    if(S.busy)return;
    var w=norm($('#word').value).replace(/[^a-z0-9]/g,'');
    function say(msg,miss){S.gate={msg:msg,miss:miss||'',confirm:false};gateMsg()}
    if(w.length<4){say('A palavra precisa ter pelo menos 4 letras ou números.');return}
    if(!initDb()){say('Não deu para conectar. Confira a internet e tente de novo.');return}
    S.busy=true;say('Conferindo…');
    S.db.doc('bands/'+w+'/lib/songs').get().then(function(s){
      S.busy=false;
      if(s.exists)enterBand(w);else say('Não achei a banda com essa palavra.',w);
    },function(){S.busy=false;say('Não deu para conectar. Confira a internet e tente de novo.')});
  },
  'create-ask':function(){S.gate.confirm=true;gateMsg()},
  'create-lib':function(){
    if(S.busy||!S.gate.miss)return;
    var w=S.gate.miss,base='bands/'+w+'/',seed;
    try{seed=JSON.parse($('#seed').textContent)}catch(e){seed={songs:{}}}
    S.busy=true;S.gate={msg:'Criando a biblioteca…',miss:'',confirm:false};gateMsg();
    var chain=S.db.doc(base+'lib/songs').set(seed);
    MEMBERS.forEach(function(m){chain=chain.then(function(){return S.db.doc(base+'votes/'+m.id).set({v:{}})})});
    chain.then(function(){S.busy=false;enterBand(w)},function(){
      S.busy=false;S.gate={msg:'Não deu para criar. Confira as regras do banco de dados.',miss:w,confirm:false};gateMsg();
    });
  },
  'forget-word':function(){S.word=null;store.del('banda.word');disconnect();S.gate={msg:'',miss:'',confirm:false};mounted=null;refresh();window.scrollTo(0,0)},
  login:function(d){S.me=d.id;store.set('banda.me',d.id);refresh();window.scrollTo(0,0)},
  'switch-user':function(){S.me=null;store.del('banda.me');S.stick={};refresh();window.scrollTo(0,0)},
  tab:function(d){
    if(TABS.indexOf(d.tab)<0)return;
    S.tab=d.tab;store.set('banda.tab',S.tab);S.stick={};
    try{history.replaceState(null,'','#'+S.tab)}catch(e){}
    refresh();window.scrollTo(0,0);
  },
  'toggle-filters':function(){S.showFilters=!S.showFilters;refreshLib()},
  filt:function(d){
    var k=d.k;
    if(typeof S.f[k]==='boolean')S.f[k]=!S.f[k];else S.f[k]=S.f[k]===d.v?'':d.v;
    S.stick={};refreshLib();
  },
  'clear-filters':function(){S.f={origin:'',voice:'',genre:'',novote:false,nokey:false};S.q='';S.stick={};var q=$('#q');if(q)q.value='';refreshLib()},
  sort:function(d){S.sort=d.v==='artist'?'artist':'title';refreshLib()},
  'rank-origin':function(d){S.rankOrigin=d.v||'';refreshRank()},
  vote:function(d){
    if(!guard())return;
    var n=+d.n,cur=getVote(S.me,d.id),o={};
    o[d.id]=(cur===n)?-1:n;
    if(S.f.novote)S.stick[d.id]=true;
    patchDoc('votes/'+S.me,{v:o},350);
  },
  'open-song':function(d){if(S.songs[d.id])openSheet({type:'song',id:d.id})},
  'add-open':function(){if(!guard())return;openSheet({type:'add',origin:'',genre:'',built:false})},
  'add-origin':function(d){S.sheet.origin=S.sheet.origin===d.v?'':d.v;renderAdd()},
  'add-genre':function(d){S.sheet.genre=S.sheet.genre===d.v?'':d.v;renderAdd()},
  'add-save':function(){
    if(!guard())return;
    var sh=S.sheet,ok=addItems().filter(function(o){return !o.dup}),batch={},stamp=Date.now().toString(36);
    if(!ok.length)return;
    ok.forEach(function(o,i){
      batch['n'+stamp+i]={title:o.title,artist:o.artist,origin:o.origin||sh.origin||'',genre:o.genre||sh.genre||'',key:o.key||'',bpm:0,voice:'',dur:0,by:S.me};
    });
    closeSheet();
    patchDoc('lib/songs',{songs:batch},0);
    toast(ok.length===1?'1 música adicionada.':ok.length+' músicas adicionadas.');
  },
  'rm-song-ask':function(){S.sheet.confirmRm=true;refreshSheet(true)},
  'rm-song-cancel':function(){S.sheet.confirmRm=false;refreshSheet(true)},
  'rm-song':function(){if(!guard())return;var id=S.sheet.id;closeSheet();patchSong(id,{removed:true},0);toast('Música tirada da biblioteca.')},
  'close-sheet':function(){closeSheet()},
  'key-note':function(d){if(!guard())return;var id=S.sheet.id,k=parseKey(S.songs[id].key);patchSong(id,{key:d.v+k.mode});refreshSheet(true)},
  'key-acc':function(d){
    if(!guard())return;var id=S.sheet.id,k=parseKey(S.songs[id].key);
    if(!k.note){toast('Escolha a nota primeiro.');return}
    patchSong(id,{key:k.note+(k.acc===d.v?'':d.v)+k.mode});refreshSheet(true);
  },
  'key-mode':function(d){
    if(!guard())return;var id=S.sheet.id,k=parseKey(S.songs[id].key);
    if(!k.note){toast('Escolha a nota primeiro.');return}
    patchSong(id,{key:k.note+k.acc+(d.v==='m'?'m':'')});refreshSheet(true);
  },
  'key-clear':function(){if(!guard())return;patchSong(S.sheet.id,{key:''});refreshSheet(true)},
  'bpm-step':function(d){
    if(!guard())return;var id=S.sheet.id,cur=+S.songs[id].bpm||0;
    patchSong(id,{bpm:cur>0?clamp(cur+(+d.d),30,300):100},500);refreshSheet(true);
  },
  'set-voice':function(d){if(!guard())return;var id=S.sheet.id;patchSong(id,{voice:S.songs[id].voice===d.v?'':d.v});refreshSheet(true)},
  'set-origin':function(d){if(!guard())return;patchSong(S.sheet.id,{origin:d.v});refreshSheet(true)},
  'set-genre':function(d){if(!guard())return;patchSong(S.sheet.id,{genre:d.v});refreshSheet(true)},
  'dur-step':function(d){
    if(!guard())return;var id=S.sheet.id,cur=+S.songs[id].dur||0;
    patchSong(id,{dur:cur>0?clamp(cur+(+d.d),30,900):210},500);refreshSheet(true);
  },
  'dur-clear':function(){if(!guard())return;patchSong(S.sheet.id,{dur:0});refreshSheet(true)},

  'new-set':function(){if(!guard())return;S.setForm={id:null,name:'',date:''};refreshSets(true);var i=$('#set-name');if(i)i.focus()},
  'edit-set':function(){if(!guard())return;var s=S.sets[S.openSet];S.setForm={id:S.openSet,name:s.name||'',date:s.date||''};refreshSets(true)},
  'cancel-set-form':function(){S.setForm=null;refreshSets(true)},
  'save-set-form':function(){
    if(!guard()||S.busy)return;
    var name=($('#set-name').value||'').trim(),date=$('#set-date').value||'';
    if(!name){toast('Dê um nome ao repertório.');return}
    if(S.setForm.id){
      var id=S.setForm.id;S.setForm=null;
      patchDoc('setlists/'+id,{name:name,date:date},0);refreshSets(true);
      return;
    }
    S.busy=true;S.setForm.name=name;S.setForm.date=date;refreshSets(true);
    S.db.collection(P('setlists')).add({name:name,date:date,songs:[],by:S.me,ts:Date.now()}).then(function(ref){
      S.busy=false;S.setForm=null;
      setIds[ref.id]=true;if(!raw['setlists/'+ref.id])raw['setlists/'+ref.id]={name:name,date:date,songs:[],by:S.me};
      S.openSet=ref.id;derive();refreshSets(true);window.scrollTo(0,0);
    },function(e){S.busy=false;fail(e);refreshSets(true)});
  },
  'open-set':function(d){S.openSet=d.id;S.setEdit=false;S.confirmDel=false;S.setForm=null;refreshSets(true);window.scrollTo(0,0)},
  'back-sets':function(){S.openSet=null;S.setEdit=false;S.confirmDel=false;S.setForm=null;refreshSets(true);window.scrollTo(0,0)},
  'toggle-set-edit':function(){S.setEdit=!S.setEdit;refreshSets(true)},
  'add-songs':function(){if(!guard())return;openSheet({type:'picker',setId:S.openSet,q:'',built:false})},
  pick:function(d){
    if(!guard())return;var sid=S.sheet.setId,set=S.sets[sid];if(!set)return;
    var arr=setSongs(set).slice(),i=arr.indexOf(d.id);
    if(i>=0)arr.splice(i,1);else arr.push(d.id);
    patchDoc('setlists/'+sid,{songs:arr},500);
  },
  mv:function(d){
    if(!guard())return;var set=S.sets[S.openSet];if(!set)return;
    var arr=setSongs(set).slice(),i=arr.indexOf(d.id),j=i+(+d.d);
    if(i<0||j<0||j>=arr.length)return;
    var t=arr[i];arr[i]=arr[j];arr[j]=t;
    patchDoc('setlists/'+S.openSet,{songs:arr},600);
  },
  rm:function(d){
    if(!guard())return;var set=S.sets[S.openSet];if(!set)return;
    var arr=setSongs(set).filter(function(x){return x!==d.id});
    patchDoc('setlists/'+S.openSet,{songs:arr},600);
  },
  'ask-del':function(){if(!guard())return;S.confirmDel=true;refreshSets(true)},
  'cancel-del':function(){S.confirmDel=false;refreshSets(true)},
  'del-set':function(){
    if(!guard()||S.busy)return;var id=S.openSet,path='setlists/'+id;
    S.busy=true;
    if(pend[path]){clearTimeout(pend[path].timer);delete pend[path]}
    S.db.doc(P(path)).delete().then(function(){
      S.busy=false;delete setIds[id];delete raw[path];S.openSet=null;S.confirmDel=false;S.setEdit=false;
      derive();refreshSets(true);toast('Repertório excluído.');
    },function(e){S.busy=false;fail(e)});
  }
};

document.addEventListener('click',function(e){
  var t=e.target;
  if(t&&t.id==='sheet'){closeSheet();return}
  var el=t&&t.closest?t.closest('[data-act]'):null;
  if(!el||el.disabled)return;
  var fn=ACT[el.dataset.act];
  if(fn)fn(el.dataset,el);
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='q'){S.q=t.value;S.stick={};refreshLib()}
  else if(t.id==='pq'&&S.sheet&&S.sheet.type==='picker'){S.sheet.q=t.value;refreshSheet(false)}
  else if(t.id==='add-text'){renderAdd()}
  else if(t.id==='bpm-input'&&S.sheet&&S.sheet.type==='song'){
    if(S.readOnly||!S.db)return;
    var raw_=t.value.replace(/\D/g,'');if(raw_!==t.value)t.value=raw_;
    var n=parseInt(raw_,10);
    if(!raw_)patchSong(S.sheet.id,{bpm:0},700);
    else if(n>=30&&n<=300)patchSong(S.sheet.id,{bpm:n},700);
  }
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&S.sheet)closeSheet();
  if(e.key==='Enter'&&e.target&&e.target.id==='word'){e.preventDefault();ACT['enter-word']()}
  if(e.key==='Enter'&&e.target&&(e.target.id==='set-name'||e.target.id==='set-date')){e.preventDefault();ACT['save-set-form']()}
});

/* ---------- start ---------- */
var saved=store.get('banda.me');
if(saved&&memberName(saved))S.me=saved;
var h=(location.hash||'').replace('#',''),st=store.get('banda.tab');
if(TABS.indexOf(h)>=0)S.tab=h;else if(TABS.indexOf(st)>=0)S.tab=st;
var sw=store.get('banda.word');
if(sw&&/^[a-z0-9]{4,40}$/.test(sw)){S.word=sw;connect()}else refresh();
})();
</script>
